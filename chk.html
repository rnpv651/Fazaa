<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دفع رسوم البطاقة</title>
    <!-- استدعاء نفس الخط المستخدم في صفحة index -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }
        body {
            /* خلفية بيضاء سادة بدون أي صور أو ورود */
            background-color: #ffffff;
            color: #333;
        }
        /* نفس حاوية صفحة index للحفاظ على التناسق */
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px 15px;
            min-height: 100vh;
        }
        
        /* تصميم زر/شريط العنوان العلوي */
        .page-header {
            background-color: #219d8e; /* لون مقارب للصورة */
            color: #ffffff;
            text-align: center;
            padding: 15px;
            border-radius: 6px;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 40px;
        }

        /* تصميم صندوق تفاصيل الرسوم */
        .fees-box {
            background-color: #ececec; /* لون رمادي فاتح */
            border-radius: 6px;
            margin-bottom: 40px;
            position: relative;
            padding-bottom: 20px;
        }
        
        .fees-title {
            background-color: #219d8e;
            color: #ffffff;
            text-align: center;
            padding: 8px 30px;
            font-size: 16px;
            font-weight: 700;
            display: inline-block;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
        }

        .fees-details {
            padding: 50px 30px 10px 30px;
        }

        .fee-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 16px;
            font-weight: 500;
        }

        .fee-row.total {
            margin-top: 30px;
            font-weight: 700;
        }

        /* شريط طرق الدفع */
        .payment-banner {
            background-color: #363636;
            color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            margin-bottom: 30px;
        }

        .payment-banner span {
            font-size: 16px;
            font-weight: 700;
        }

        .payment-logos {
            display: flex;
            gap: 5px;
            background-color: #ffffff;
            padding: 5px;
        }

        .payment-logos img {
            height: 20px;
            object-fit: contain;
        }

        /* زر المتابعة للدفع */
        .btn-submit {
            display: block;
            background-color: #0d3460; /* لون أزرق داكن */
            color: #ffffff;
            text-align: center;
            padding: 15px;
            font-size: 18px;
            font-weight: 700;
            width: 100%;
            border: none;
            cursor: pointer;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- العنوان العلوي -->
    <div class="page-header">
        دفع رسوم طلب البطاقة
    </div>

    <!-- صندوق الرسوم -->
    <div class="fees-box">
        <div class="fees-title">
            الرسوم
        </div>
        <div class="fees-details">
            <div class="fee-row">
                <span>رسوم تقديم الطلب</span>
                <span>19 درهم</span>
            </div>
            <div class="fee-row">
                <span>رسوم إضافية</span>
                <span>0 دراهم</span>
            </div>
            <div class="fee-row total">
                <span>المجموع</span>
                <span>19 درهم</span>
            </div>
        </div>
    </div>

    <!-- شريط الدفع عبر البطاقة -->
    <div class="payment-banner">
